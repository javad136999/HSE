name: HSE data refresh

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hse-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and store latest air-quality data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret CRON_SECRET. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://hsepetroenv.vercel.app/api/cron
