<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شبیه‌سازی پراکندگی حادثه – HSE عسلویه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#071a2b;color:#e8f1f8;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#06141f;border-bottom:3px solid #ff7a1a}
header a{color:#e8f1f8;text-decoration:none;border:1px solid #1c4466;border-radius:8px;padding:4px 10px;font-size:13px}header h1{font-size:14px;margin:0}
#ctl{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#0d2a43;font-size:13px;align-items:center}
select,input,button{background:#0a2236;color:#e8f1f8;border:1px solid #1c4466;border-radius:8px;padding:5px 8px;font-family:inherit;width:auto}input{width:70px}
#map{flex:1;min-height:300px}#info{padding:8px 12px;background:#0d2a43;font-size:12px;line-height:1.8}
.w{color:#ffb347}
</style></head><body>
<header><a href="/">→ بازگشت</a><h1>شبیه‌سازی پراکندگی گاز/دود – ویژه مدیران</h1></header>
<div id="ctl">
<label>ماده <select id="mat"><option value="1500">H₂S</option><option value="1200">آمونیاک</option><option value="1000">LPG / گاز قابل اشتعال</option><option value="2000">کلر</option><option value="1500">دود آتش‌سوزی</option></select></label>
<label>شدت <select id="rate"><option value=".5">کم</option><option value="1" selected>متوسط</option><option value="1.8">زیاد</option></select></label>
<label>باد km/h <input id="ws" type="number" min="0"></label>
<label>جهت باد (از) ° <input id="wd" type="number" min="0" max="360"></label>
<button id="live">باد زنده</button><button id="sat">ماهواره/نقشه</button>
</div>
<div id="map"></div>
<div id="info">روی نقشه در محل حادثه کلیک کنید.</div>
<script>
const map=L.map('map').fitBounds([[27.35,52.35],[27.70,52.85]]); // محدوده تقریبی منطقه ویژه اقتصادی انرژی پارس (صنایع گازی و پتروشیمی)؛ با تغییر این مختصات قابل تنظیم است
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'});
let isSat=false;document.getElementById('sat').onclick=()=>{isSat?(map.removeLayer(sat),osm.addTo(map)):(map.removeLayer(osm),sat.addTo(map));isSat=!isSat};
const $=i=>document.getElementById(i);let src=null,layer=L.layerGroup().addTo(map);
async function live(){try{const d=await (await fetch('/api/live')).json();$('ws').value=Math.round(d.wind_speed);$('wd').value=Math.round(d.wind_dir);draw()}catch(e){}}
$('live').onclick=live;
function off(lat,lon,dx,dy){return [lat+dy/111320,lon+dx/(111320*Math.cos(lat*Math.PI/180))]}
function fan(lat,lon,th,L,W){const u=[Math.sin(th),Math.cos(th)],p=[Math.cos(th),-Math.sin(th)],l=[],r=[];
for(let i=0;i<=24;i++){const t=i/24,d=L*t,w=W*Math.sin(Math.PI*Math.pow(t,.6));
l.push(off(lat,lon,d*u[0]+w*p[0],d*u[1]+w*p[1]));r.push(off(lat,lon,d*u[0]-w*p[0],d*u[1]-w*p[1]))}
return l.concat(r.reverse())}
function draw(){if(!src)return;layer.clearLayers();
const ws=+$('ws').value||0,wd=+$('wd').value||0,base=+$('mat').value*+$('rate').value;
const L=base*Math.min(2,Math.max(.6,10/Math.max(ws,3))),W=L*.28*Math.min(2,Math.max(.8,8/Math.max(ws,2)));
const th=((wd+180)%360)*Math.PI/180,[la,lo]=src;
[[1,'#e74c3c','خطر بالا'],[.7,'#e67e22','خطر متوسط'],[.4,'#f1c40f','هشدار']].forEach(([k,c,n])=>{});
[[1,'#f1c40f'],[.7,'#e67e22'],[.4,'#e74c3c']].forEach(([k,c])=>L_(la,lo,th,L*k,W*k,c));
function L_(a,b,t,l,w,c){L.constructor;layer.addLayer(window.L.polygon(fan(a,b,t,l,w),{color:c,weight:1,fillOpacity:.35}))}
layer.addLayer(window.L.circleMarker(src,{radius:7,color:'#fff',fillColor:'#e74c3c',fillOpacity:1}));
const up=off(la,lo,-Math.sin(th)*900,-Math.cos(th)*900);
layer.addLayer(window.L.polyline([src,up],{color:'#2ecc71',dashArray:'6 6',weight:3}));
layer.addLayer(window.L.marker(up,{icon:window.L.divIcon({html:'<b style="color:#2ecc71;white-space:nowrap">⬆ جهت امن (بالادست باد)</b>',className:''})}));
$('info').innerHTML=`باد از سمت <b>${Math.round(wd)}°</b> با <b>${Math.round(ws)} km/h</b> • حداکثر برد تخمینی منطقه‌ی هشدار: <b>${Math.round(L)} متر</b>.<br>برای تخلیه: عمود بر جهت باد یا به سمت بالادست (خط سبز) حرکت کنید.<br><span class="w">⚠ برآورد هندسی اولیه است، نه جایگزین ALOHA/PHAST یا تصمیم فرمانده صحنه.</span>`}
const Lf=window.L;
map.on('click',e=>{src=[e.latlng.lat,e.latlng.lng];draw()});
['mat','rate','ws','wd'].forEach(i=>$(i).addEventListener('input',draw));
live();
</script></body></html>
